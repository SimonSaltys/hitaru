[project]
name = "hitaru-aligner"
version = "0.1.0"
description = "Times subtitle words against an episode's audio for Hitaru's word highlighting."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fugashi>=1.5.2",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.26",
  "stable-ts>=2.17",
  "torch>=2.5",
  "torchaudio>=2.5",
  "unidic-lite>=1.0.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
